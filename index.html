<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG Model Price List</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
margin:0;
padding:15px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header img{
width:120px;
}

h1{
margin:5px;
color:#333;
}

.search-box{
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.filter-bar{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:20px;
}

.filter-btn{
padding:6px 10px;
border:none;
background:#e0e0e0;
border-radius:4px;
cursor:pointer;
font-size:13px;
}

.filter-btn:hover{
background:#c62828;
color:white;
}

.product-container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
font-size:16px;
margin-bottom:6px;
}

.category{
font-size:12px;
color:#888;
margin-bottom:8px;
}

.price{
font-size:14px;
margin-bottom:4px;
}

.dp{
color:#c62828;
font-weight:bold;
}

.desc{
font-size:13px;
color:#444;
margin-top:8px;
}

</style>
</head>

<body>

<div class="header">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/LG_symbol.svg/512px-LG_symbol.svg.png">
<h1>LG Model Price List</h1>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search model...">
</div>

<div class="filter-bar">

<button class="filter-btn" onclick="filterCategory('ALL')">ALL</button>
<button class="filter-btn" onclick="filterCategory('AUDIO')">AUDIO</button>
<button class="filter-btn" onclick="filterCategory('DC')">DC</button>
<button class="filter-btn" onclick="filterCategory('FAN & APR')">FAN & APR</button>
<button class="filter-btn" onclick="filterCategory('FL-WM & DWASH')">FL-WM & DWASH</button>
<button class="filter-btn" onclick="filterCategory('FPD')">FPD</button>
<button class="filter-btn" onclick="filterCategory('French Door')">French Door</button>
<button class="filter-btn" onclick="filterCategory('MWO')">MWO</button>
<button class="filter-btn" onclick="filterCategory('RAC')">RAC</button>
<button class="filter-btn" onclick="filterCategory('SA-WM')">SA-WM</button>
<button class="filter-btn" onclick="filterCategory('SIDE BY SID')">SIDE BY SID</button>
<button class="filter-btn" onclick="filterCategory('TF-MODELS')">TF-MODELS</button>
<button class="filter-btn" onclick="filterCategory('TL-WM')">TL-WM</button>
<button class="filter-btn" onclick="filterCategory('WATER Purifier')">WATER Purifier</button>

</div>

<div class="product-container" id="productList"></div>

<script>

let sheetID = "1BumCKJIu699JbullfevdlkQhdVsz09Ehc-8PK05lJGM";
let sheetName = "Sheet1";

let url = `https://opensheet.elk.sh/${sheetID}/${sheetName}`;

let products = [];
let currentCategory = "ALL";

fetch(url)
.then(res => res.json())
.then(data => {

products = data;
displayProducts(products);

});


function displayProducts(list){

let html = "";

list.forEach(item => {

html += `
<div class="card" data-category="${item.Category}">

<div class="model">${item.MODEL}</div>

<div class="category">${item.Category}</div>

<div class="price">MRP : ₹${item.MRP}</div>

<div class="price dp">DP : ₹${item.DP}</div>

<div class="price">GST : ${item["GST %"]}%</div>

<div class="price">CAT : ${item.CAT}</div>

<div class="desc">${item.Description}</div>

</div>
`;

});

document.getElementById("productList").innerHTML = html;

}


function filterCategory(category){

currentCategory = category;
applyFilters();

}


document.getElementById("searchInput").addEventListener("keyup", applyFilters);


function applyFilters(){

let search = document.getElementById("searchInput").value.toLowerCase();

let filtered = products.filter(item => {

let matchCategory = currentCategory === "ALL" || item.Category === currentCategory;

let matchSearch =
item.MODEL.toLowerCase().includes(search) ||
item.Description.toLowerCase().includes(search);

return matchCategory && matchSearch;

});

displayProducts(filtered);

}

</script>

</body>
</html>
